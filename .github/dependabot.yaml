updates:
  - directory: /
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "@tsconfig/node-lts"
        update-types:
          - version-update:semver-major
    package-ecosystem: npm
    schedule:
      interval: weekly
  - directory: /
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    package-ecosystem: github-actions
    schedule:
      interval: weekly
version: 2
