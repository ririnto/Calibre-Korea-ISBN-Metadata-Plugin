updates:
  - directory: /
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    package-ecosystem: npm
    schedule:
      interval: weekly
  - directory: /
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    package-ecosystem: github-actions
    schedule:
      interval: weekly
version: 2
